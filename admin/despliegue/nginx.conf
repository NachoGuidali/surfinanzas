# ---------------------------------------------------------------------------
# Sur Finanzas — nginx
#
# Dos server blocks:
#   1. el sitio público (estático)
#   2. panel.surfinanzas.com.ar -> el panel (proxy a gunicorn)
#
# Copiá a /etc/nginx/sites-available/surfinanzas y enlazá a sites-enabled.
# Los certificados los pone certbot: sudo certbot --nginx -d surfinanzas.com.ar ...
# ---------------------------------------------------------------------------

# Límite para el formulario de contacto: 10 por minuto por IP, con ráfaga de 5.
# Esto frena bots antes de que lleguen a Python.
limit_req_zone $binary_remote_addr zone=contacto:10m rate=10r/m;

# --- HTTP -> HTTPS --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name surfinanzas.com.ar www.surfinanzas.com.ar panel.surfinanzas.com.ar;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- Sitio público --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name surfinanzas.com.ar www.surfinanzas.com.ar;

    root /var/www/surfinanzas;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/surfinanzas.com.ar/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # IMPORTANTE: nada de esto se sirve nunca al público.
    location ~ ^/(admin|tools)/           { deny all; return 404; }
    location ~ ^/blog/_posts/             { deny all; return 404; }
    location ~ ^/datos/                   { deny all; return 404; }
    location ~* \.(md|py|json|lock|toml|service|conf|env)$ { deny all; return 404; }
    location ~ /\.                        { deny all; return 404; }
    location = /site.webmanifest { }      # esta sí, es pública

    # Los videos y las imágenes cambian poco: caché largo.
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El HTML se revalida siempre, para que una nota nueva se vea al toque.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Formulario de contacto: mismo dominio que el sitio, así no hay CORS.
    location /api/ {
        limit_req zone=contacto burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        client_max_body_size 64k;
    }

    location / { try_files $uri $uri/ $uri.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 512;

    error_page 404 /index.html;
}

# --- Panel ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.surfinanzas.com.ar;

    # ssl_certificate     /etc/letsencrypt/live/panel.surfinanzas.com.ar/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/panel.surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Las imágenes que se suben pueden pesar hasta 8 MB.
    client_max_body_size 10m;

    # Opcional pero muy recomendable: limitar el panel a las IPs del equipo.
    # allow 200.100.50.25;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
