# ---------------------------------------------------------------------------
# Sur Finanzas — nginx
#
# Este nginx es la única puerta de entrada del servidor (puertos 80 y 443)
# y reparte por subdominio:
#
#   surfinanzas.com.ar / www    -> el sitio público (estático)
#   panel.surfinanzas.com.ar    -> panel del blog      (gunicorn, 127.0.0.1:8001)
#   analytics.surfinanzas.com.ar-> analítica            (Docker,   127.0.0.1:8081)
#   mails.surfinanzas.com.ar    -> bot de mails         (Docker,   127.0.0.1:8082)
#
# La analítica y el bot traen su propio nginx dentro de Docker: ese NO puede
# tomar el 80 ni el 443. En su docker-compose, publicar solo en localhost:
#     ports: ["127.0.0.1:8081:80"]    (analítica)
#     ports: ["127.0.0.1:8082:80"]    (bot de mails)
# Si se publica "8081:80" a secas, Docker saltea el firewall y el panel queda
# expuesto a internet sin HTTPS.
#
# Copiá a /etc/nginx/sites-available/surfinanzas y enlazá a sites-enabled.
# Los certificados los pone certbot:
#   sudo certbot --nginx -d surfinanzas.com.ar -d www.surfinanzas.com.ar \
#     -d panel.surfinanzas.com.ar -d analytics.surfinanzas.com.ar -d mails.surfinanzas.com.ar
# ---------------------------------------------------------------------------

# Límite para el formulario de contacto: 10 por minuto por IP, con ráfaga de 5.
# Esto frena bots antes de que lleguen a Python.
limit_req_zone $binary_remote_addr zone=contacto:10m rate=10r/m;

# TLS: "ssl_protocols" y "ssl_prefer_server_ciphers" NO van acá. Ubuntu ya las
# define en /etc/nginx/nginx.conf y nginx no admite que se repitan. Para dejar
# solo TLS 1.2 y 1.3, editá esa línea en el archivo global.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Analítica: cada visita manda unos 12 eventos. 20 por segundo por IP es
# holgado para una persona navegando y corta a quien intente inundarla.
limit_req_zone $binary_remote_addr zone=analitica:10m rate=20r/s;

# Para los paneles que usen WebSockets (actualización en vivo).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP -> HTTPS --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name surfinanzas.com.ar www.surfinanzas.com.ar panel.surfinanzas.com.ar
                analytics.surfinanzas.com.ar mails.surfinanzas.com.ar;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- Sitio público --------------------------------------------------------
server {
    # "http2" va en el listen: la directiva "http2 on" recién existe desde
    # nginx 1.25.1 y Ubuntu 24.04 trae la 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surfinanzas.com.ar www.surfinanzas.com.ar;

    root /var/www/surfinanzas;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/surfinanzas.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # IMPORTANTE: nada de esto se sirve nunca al público.
    location ~ ^/(admin|tools)/           { deny all; return 404; }
    location ~ ^/blog/_posts/             { deny all; return 404; }
    location ~ ^/datos/                   { deny all; return 404; }
    location ~* \.(md|py|json|lock|toml|service|conf|env)$ { deny all; return 404; }
    location ~ /\.                        { deny all; return 404; }
    location = /site.webmanifest { }      # esta sí, es pública

    # Los videos y las imágenes cambian poco: caché largo.
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El HTML se revalida siempre, para que una nota nueva se vea al toque.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Formulario de contacto: mismo dominio que el sitio, así no hay CORS.
    location /api/ {
        limit_req zone=contacto burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        client_max_body_size 64k;
    }

    location / { try_files $uri $uri/ $uri.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;   # el HTML ya va siempre
    gzip_min_length 512;

    error_page 404 /index.html;
}

# --- Panel ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.surfinanzas.com.ar;

    ssl_certificate     /etc/letsencrypt/live/surfinanzas.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Las imágenes que se suben pueden pesar hasta 8 MB.
    client_max_body_size 10m;

    # Opcional pero muy recomendable: limitar el panel a las IPs del equipo.
    # allow 200.100.50.25;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Analítica --------------------------------------------------------------
# Tiene que ser pública: el script de seguimiento manda los eventos desde el
# navegador de cada visitante. El dashboard lo protege el login de la app.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.surfinanzas.com.ar;

    ssl_certificate     /etc/letsencrypt/live/surfinanzas.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    location / {
        limit_req zone=analitica burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# --- Bot de mails -----------------------------------------------------------
# Solo lo usan los operadores. Nadie de afuera necesita entrar.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mails.surfinanzas.com.ar;

    ssl_certificate     /etc/letsencrypt/live/surfinanzas.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surfinanzas.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Por si el panel permite adjuntar archivos.
    client_max_body_size 25m;

    # Muy recomendable: limitar el panel a las IPs del equipo.
    # allow 200.100.50.25;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
