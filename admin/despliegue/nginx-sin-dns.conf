# ---------------------------------------------------------------------------
# Sur Finanzas — nginx PROVISORIO, para probar por IP antes de tener DNS
#
# Sirve el sitio por HTTP en el puerto 80, sin certificados. El panel no se
# publica acá: se prueba por un túnel SSH desde tu PC, así no queda expuesto
# sin HTTPS.
#
#   sudo cp admin/despliegue/nginx-sin-dns.conf /etc/nginx/sites-available/surfinanzas
#   sudo ln -sf /etc/nginx/sites-available/surfinanzas /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cuando el DNS ya apunte al servidor, se reemplaza por nginx.conf y se piden
# los certificados con certbot.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=contacto_tmp:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/surfinanzas;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    # Todavía no está publicado: que no lo indexe nadie mientras se prueba
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(admin|tools)/           { deny all; return 404; }
    location ~ ^/blog/_posts/             { deny all; return 404; }
    location ~ ^/datos/                   { deny all; return 404; }
    location ~* \.(md|py|json|lock|toml|service|conf|env)$ { deny all; return 404; }
    location ~ /\.                        { deny all; return 404; }
    location = /site.webmanifest { }

    location /api/ {
        limit_req zone=contacto_tmp burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        client_max_body_size 64k;
    }

    location / { try_files $uri $uri/ $uri.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    error_page 404 /index.html;
}
