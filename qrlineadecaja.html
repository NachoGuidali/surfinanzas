<head>

<style>
  :root {
    --fondo: #0b0b0f;
    --texto: #f5f6f8;
    --tenue: #9aa3b2;
    --marca: #09FED5;
    --borde: rgba(255, 255, 255, 0.1);
    --wa: #25d366;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--fondo);
    color: var(--texto);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2.5rem 1.25rem 3rem;
  }

  /* Fondo: el isotipo fijo, muy tenue, y dos manchas turquesas */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: url("assets/branding/isotipo-sur.png") no-repeat center 45% / min(78vw, 26rem);
    opacity: 0.05;
    pointer-events: none;
  }
  .manchas { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .mancha {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    background: var(--marca);
  }
  .m1 { width: 26rem; height: 26rem; top: -10rem; right: -8rem; opacity: 0.2; }
  .m2 { width: 20rem; height: 20rem; bottom: -9rem; left: -7rem; opacity: 0.12; }

  main { width: min(30rem, 100%); text-align: center; }

  .logo { width: min(15rem, 62vw); height: auto; margin: 0 auto 1.5rem; display: block; }

  /* "El nuevo Surfi", igual que en el inicio del sitio */
  .surfi-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 1.75rem;
    padding: 0.5rem 1.2rem 0.5rem 1.05rem;
    border: 1px solid rgba(9, 254, 213, 0.32);
    border-radius: 999px;
    background: rgba(9, 254, 213, 0.1);
    color: var(--marca);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    box-shadow: 0 0 28px rgba(9, 254, 213, 0.16);
  }
  .surfi {
    display: inline-block;
    font-size: 1.7em;
    line-height: 1;
    letter-spacing: 0;
    transform-origin: 50% 80%;
    filter: drop-shadow(0 0 10px rgba(9, 254, 213, 0.45));
    animation: surfeando 2.8s ease-in-out infinite;
  }
  @keyframes surfeando {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    20%  { transform: translateY(-5px) rotate(4deg); }
    45%  { transform: translateY(2px) rotate(9deg); }
    70%  { transform: translateY(-3px) rotate(-2deg); }
    85%  { transform: translateY(1px) rotate(-6deg); }
  }

  /* El nombre de la línea, en las páginas de un solo QR */
  .titulo { margin: -0.5rem 0 1.6rem; }
  .titulo h1 {
    margin: 0;
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .titulo .bajada { margin: 0.35rem 0 0; color: var(--tenue); font-size: 0.95rem; }

  .enlaces { display: grid; gap: 0.85rem; }

  .enlace {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.15rem;
    border: 1px solid var(--borde);
    border-radius: 1.1rem;
    background: rgba(255, 255, 255, 0.035);
    color: inherit;
    text-decoration: none;
    text-align: left;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .enlace:hover, .enlace:focus-visible {
    transform: translateY(-2px);
    border-color: rgba(9, 254, 213, 0.5);
    background: rgba(9, 254, 213, 0.07);
  }
  .enlace:focus-visible { outline: 2px solid var(--marca); outline-offset: 3px; }

  .enlace-icono {
    display: grid;
    place-items: center;
    width: 2.9rem;
    height: 2.9rem;
    border-radius: 0.9rem;
    border: 1px solid var(--borde);
    background: rgba(255, 255, 255, 0.04);
    color: var(--marca);
  }
  .enlace-icono svg { width: 1.45rem; height: 1.45rem; }

  .enlace-texto { display: flex; flex-direction: column; min-width: 0; }
  .enlace-texto strong { font-size: 1.02rem; font-weight: 600; }
  .enlace-texto span { font-size: 0.86rem; color: var(--tenue); }

  .enlace-flecha { color: var(--tenue); display: grid; place-items: center; }
  .enlace-flecha svg { width: 1.1rem; height: 1.1rem; }
  .enlace:hover .enlace-flecha { color: var(--marca); transform: translateX(3px); }

  /* Cada botón con el color de su marca al pasar el mouse */
  .es-instagram:hover .enlace-icono { border-color: #E1306C; background: rgba(225, 48, 108, 0.14); color: #FF6E9C; }
  .es-whatsapp .enlace-icono { color: var(--wa); }
  .es-whatsapp:hover .enlace-icono { border-color: var(--wa); background: rgba(37, 211, 102, 0.14); }
  .es-resena .enlace-icono { color: #FFC33D; }
  .es-resena:hover .enlace-icono { border-color: #FFC33D; background: rgba(255, 195, 61, 0.14); }

  .pie { margin-top: 2rem; font-size: 0.85rem; color: var(--tenue); }
  .pie a { color: var(--marca); text-decoration: none; }
  .pie a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .surfi { animation: none; }
    .enlace, .enlace:hover { transform: none; }
  }
</style>
</head>
<body>

<div class="manchas" aria-hidden="true">
  <div class="mancha m1"></div>
  <div class="mancha m2"></div>
</div>

<main>
  <img class="logo" src="assets/branding/logo-sur.svg" alt="Sur Finanzas" width="399" height="155" />

  <p class="surfi-pill">El nuevo Surfi <span class="surfi" role="img" aria-label="surfista">🏄</span></p>

  <div class="titulo">
    <h1>Línea de caja</h1>
  </div>

  <div class="enlaces">
      <a class="enlace es-whatsapp" href="https://wa.me/5491176743162?text=Hola%20Sur%20Finanzas%2C%20quiero%20consultar%20por%20la%20l%C3%ADnea%20de%20caja." target="_blank" rel="noopener">
        <span class="enlace-icono" aria-hidden="true"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.01 3C9.38 3 4 8.38 4 15.01c0 2.5.73 4.83 2 6.78L4 29l7.4-1.94a11.9 11.9 0 0 0 4.6.94h.01c6.63 0 12.01-5.38 12.01-12.01C28.02 8.38 22.64 3 16.01 3Zm7.02 17.18c-.3.83-1.7 1.58-2.35 1.68-.6.09-1.36.13-2.19-.14-.5-.16-1.15-.37-1.98-.73-3.48-1.5-5.76-5.02-5.94-5.25-.17-.23-1.42-1.89-1.42-3.6 0-1.72.9-2.56 1.22-2.91.31-.35.68-.44.91-.44.23 0 .46 0 .66.01.21.01.5-.08.78.6.3.72 1.01 2.48 1.1 2.66.09.18.15.39.03.63-.12.24-.18.39-.36.6-.18.21-.38.47-.54.63-.18.18-.37.37-.16.72.21.35.94 1.55 2.02 2.51 1.39 1.24 2.56 1.62 2.92 1.8.36.18.57.15.78-.09.21-.24.9-1.05 1.14-1.41.24-.36.48-.3.8-.18.33.12 2.08.98 2.44 1.16.36.18.6.27.68.42.09.15.09.85-.21 1.68Z"/></svg></span>
        <span class="enlace-texto">
          <strong>Escribinos por WhatsApp</strong>
          <span>Escribinos al +54 9 11 7674-3162</span>
        </span>
        <span class="enlace-flecha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
  </div>

  <p class="pie">
    <a href="https://www.surfinanzas.com.ar">surfinanzas.com.ar</a> · Plaza Canning, Buenos Aires
  </p>
</main>

</body>
</html>
