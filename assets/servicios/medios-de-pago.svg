<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ilustración de una terminal de cobro con una tarjeta y un código QR">
  <defs>
    <radialGradient id="mp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09FED5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#09FED5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mp-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="mp-posto" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#23232f"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="mp-turquesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffe9"/>
      <stop offset="100%" stop-color="#09FED5"/>
    </linearGradient>
    <linearGradient id="mp-pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09FED5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09FED5" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="mp-grilla" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="mp-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#mp-fondo)"/>
  <rect width="1200" height="900" fill="url(#mp-grilla)"/>
  <ellipse cx="880" cy="230" rx="520" ry="430" fill="url(#mp-glow)"/>
  <ellipse cx="280" cy="780" rx="380" ry="320" fill="url(#mp-glow)" opacity="0.55"/>

  <!-- QR, atrás a la derecha -->
  <g transform="rotate(7 900 560)" filter="url(#mp-sombra)">
    <rect x="770" y="410" width="290" height="290" rx="28" fill="#15151f" stroke="#09FED5" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#09FED5" fill-opacity="0.85">
      <!-- esquinas de referencia -->
      <path d="M806 446h70v70h-70zM818 458h46v46h-46z" fill-rule="evenodd"/>
      <path d="M954 446h70v70h-70zM966 458h46v46h-46z" fill-rule="evenodd"/>
      <path d="M806 594h70v70h-70zM818 606h46v46h-46z" fill-rule="evenodd"/>
      <!-- módulos -->
      <rect x="892" y="446" width="18" height="18"/><rect x="922" y="464" width="18" height="18"/>
      <rect x="892" y="492" width="18" height="18"/><rect x="922" y="510" width="18" height="18"/>
      <rect x="806" y="536" width="18" height="18"/><rect x="836" y="554" width="18" height="18"/>
      <rect x="872" y="536" width="18" height="18"/><rect x="908" y="554" width="18" height="18"/>
      <rect x="944" y="536" width="18" height="18"/><rect x="980" y="554" width="18" height="18"/>
      <rect x="1006" y="536" width="18" height="18"/>
      <rect x="892" y="594" width="18" height="18"/><rect x="926" y="612" width="18" height="18"/>
      <rect x="962" y="594" width="18" height="18"/><rect x="998" y="612" width="18" height="18"/>
      <rect x="892" y="646" width="18" height="18"/><rect x="944" y="646" width="18" height="18"/>
      <rect x="980" y="646" width="18" height="18"/>
    </g>
  </g>

  <!-- Tarjeta, arriba a la izquierda -->
  <g transform="rotate(-12 420 330)" filter="url(#mp-sombra)">
    <rect x="200" y="210" width="440" height="270" rx="30" fill="url(#mp-turquesa)"/>
    <rect x="200" y="210" width="440" height="270" rx="30" fill="#0b0b0f" fill-opacity="0.08"/>
    <rect x="238" y="272" width="72" height="54" rx="10" fill="#04120c" fill-opacity="0.35"/>
    <path d="M238 299h72M274 272v54" stroke="#04120c" stroke-opacity="0.35" stroke-width="4"/>
    <rect x="238" y="382" width="190" height="20" rx="10" fill="#04120c" fill-opacity="0.35"/>
    <rect x="238" y="418" width="120" height="16" rx="8" fill="#04120c" fill-opacity="0.22"/>
    <circle cx="540" cy="404" r="38" fill="#04120c" fill-opacity="0.22"/>
    <circle cx="582" cy="404" r="38" fill="#04120c" fill-opacity="0.22"/>
  </g>

  <!-- Terminal de cobro, adelante -->
  <g transform="rotate(-4 470 620)" filter="url(#mp-sombra)">
    <rect x="290" y="380" width="360" height="470" rx="46" fill="url(#mp-posto)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
    <rect x="326" y="424" width="288" height="180" rx="18" fill="url(#mp-pantalla)" stroke="#09FED5" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="356" y="462" width="118" height="18" rx="9" fill="#09FED5" fill-opacity="0.45"/>
    <rect x="356" y="500" width="200" height="30" rx="15" fill="#09FED5" fill-opacity="0.85"/>
    <rect x="356" y="552" width="150" height="14" rx="7" fill="#ffffff" fill-opacity="0.22"/>

    <!-- teclado -->
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="338" y="644" width="78" height="46" rx="14"/>
      <rect x="432" y="644" width="78" height="46" rx="14"/>
      <rect x="526" y="644" width="78" height="46" rx="14"/>
      <rect x="338" y="706" width="78" height="46" rx="14"/>
      <rect x="432" y="706" width="78" height="46" rx="14"/>
      <rect x="526" y="706" width="78" height="46" rx="14"/>
      <rect x="338" y="768" width="78" height="46" rx="14"/>
      <rect x="432" y="768" width="78" height="46" rx="14"/>
    </g>
    <rect x="526" y="768" width="78" height="46" rx="14" fill="#09FED5" fill-opacity="0.75"/>
  </g>

  <!-- Ondas de pago sin contacto -->
  <g fill="none" stroke="#09FED5" stroke-linecap="round" stroke-width="10" opacity="0.85">
    <path d="M690 250a58 58 0 0 1 0 84" stroke-opacity="0.9"/>
    <path d="M736 222a104 104 0 0 1 0 140" stroke-opacity="0.55"/>
    <path d="M782 194a150 150 0 0 1 0 196" stroke-opacity="0.28"/>
  </g>
</svg>
