<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ilustración de un cheque en papel y un cheque electrónico">
  <defs>
    <radialGradient id="ch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09FED5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#09FED5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ch-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="ch-papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7eaef"/>
    </linearGradient>
    <linearGradient id="ch-turquesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffe9"/>
      <stop offset="100%" stop-color="#09FED5"/>
    </linearGradient>
    <pattern id="ch-grilla" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="ch-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#ch-fondo)"/>
  <rect width="1200" height="900" fill="url(#ch-grilla)"/>
  <ellipse cx="330" cy="210" rx="520" ry="430" fill="url(#ch-glow)"/>
  <ellipse cx="980" cy="760" rx="380" ry="320" fill="url(#ch-glow)" opacity="0.55"/>

  <!-- Echeq: el cheque electrónico, atrás -->
  <g transform="rotate(-9 660 410)" filter="url(#ch-sombra)">
    <rect x="430" y="235" width="560" height="300" rx="26" fill="#15151f" stroke="#09FED5" stroke-opacity="0.38" stroke-width="2"/>
    <rect x="430" y="235" width="560" height="64" rx="26" fill="#09FED5" fill-opacity="0.09"/>
    <rect x="430" y="283" width="560" height="16" fill="#15151f"/>
    <circle cx="474" cy="267" r="9" fill="#09FED5" fill-opacity="0.55"/>
    <rect x="498" y="259" width="150" height="16" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="474" y="336" width="300" height="20" rx="10" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="474" y="382" width="210" height="20" rx="10" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="474" y="440" width="270" height="52" rx="14" fill="#09FED5" fill-opacity="0.12" stroke="#09FED5" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="498" y="458" width="180" height="16" rx="8" fill="#09FED5" fill-opacity="0.75"/>
    <rect x="828" y="430" width="120" height="66" rx="16" fill="#09FED5" fill-opacity="0.14"/>
    <path d="M858 463l18 18 34-38" fill="none" stroke="#09FED5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cheque en papel, adelante -->
  <g transform="rotate(-3 600 540)" filter="url(#ch-sombra)">
    <rect x="215" y="360" width="740" height="352" rx="20" fill="url(#ch-papel)"/>
    <rect x="215" y="360" width="740" height="10" rx="5" fill="#09FED5" fill-opacity="0.85"/>

    <rect x="262" y="410" width="196" height="18" rx="9" fill="#0b0b0f" fill-opacity="0.22"/>
    <rect x="262" y="442" width="120" height="14" rx="7" fill="#0b0b0f" fill-opacity="0.13"/>

    <!-- importe -->
    <rect x="640" y="404" width="268" height="78" rx="14" fill="#0b0b0f" fill-opacity="0.05" stroke="#09FED5" stroke-opacity="0.75" stroke-width="3"/>
    <rect x="668" y="432" width="26" height="22" rx="6" fill="#0b0b0f" fill-opacity="0.55"/>
    <rect x="708" y="432" width="172" height="22" rx="11" fill="#0b0b0f" fill-opacity="0.35"/>

    <!-- páguese a la orden de -->
    <rect x="262" y="510" width="420" height="20" rx="10" fill="#0b0b0f" fill-opacity="0.26"/>
    <rect x="262" y="548" width="560" height="14" rx="7" fill="#0b0b0f" fill-opacity="0.12"/>

    <!-- firma -->
    <path d="M660 640c26-34 42-4 58-22s16-42 38-30 20 44 44 34 26-32 44-26" fill="none" stroke="#0b0b0f" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    <rect x="640" y="662" width="250" height="4" rx="2" fill="#0b0b0f" fill-opacity="0.18"/>

    <!-- banda de datos -->
    <g fill="#0b0b0f" fill-opacity="0.35">
      <rect x="262" y="656" width="14" height="26" rx="3"/>
      <rect x="284" y="656" width="8" height="26" rx="3"/>
      <rect x="300" y="656" width="18" height="26" rx="3"/>
      <rect x="326" y="656" width="8" height="26" rx="3"/>
      <rect x="342" y="656" width="14" height="26" rx="3"/>
      <rect x="364" y="656" width="8" height="26" rx="3"/>
      <rect x="380" y="656" width="20" height="26" rx="3"/>
      <rect x="408" y="656" width="8" height="26" rx="3"/>
      <rect x="424" y="656" width="14" height="26" rx="3"/>
    </g>
  </g>

  <!-- Acreditado: sello de confirmación -->
  <g filter="url(#ch-sombra)">
    <circle cx="952" cy="308" r="66" fill="url(#ch-turquesa)"/>
    <path d="M920 308l22 24 44-50" fill="none" stroke="#04120c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
